apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "spool-rack.fullname" . }}
  labels:
    {{- include "spool-rack.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "spool-rack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "spool-rack.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "spool-rack.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: CAS_ROOT
              value: {{ .Values.persistence.mountPath | quote }}
            {{- if .Values.postgres.authType }}
            - name: POSTGRES_AUTH_TYPE
              value: {{ .Values.postgres.authType | quote }}
            {{- end }}
            {{- if .Values.postgres.dsn }}
            - name: POSTGRES_DSN
              value: {{ .Values.postgres.dsn | quote }}
            {{- else if and .Values.postgres.dsnSecret .Values.postgres.dsnSecret.name }}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.dsnSecret.name }}
                  key: {{ .Values.postgres.dsnSecret.key }}
            {{- end }}
            {{- if .Values.postgres.user }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            {{- else if and .Values.postgres.userSecret .Values.postgres.userSecret.name }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.userSecret.name }}
                  key: {{ .Values.postgres.userSecret.key }}
            {{- end }}
            {{- if and .Values.postgres.azure .Values.postgres.azure.clientId }}
            - name: POSTGRES_AZURE_CLIENT_ID
              value: {{ .Values.postgres.azure.clientId | quote }}
            {{- end }}
            {{- if and .Values.postgres.azure .Values.postgres.azure.scope }}
            - name: POSTGRES_AZURE_SCOPE
              value: {{ .Values.postgres.azure.scope | quote }}
            {{- end }}
            {{- if .Values.postgres.maxConnLifetime }}
            - name: POSTGRES_MAX_CONN_LIFETIME
              value: {{ .Values.postgres.maxConnLifetime | quote }}
            {{- end }}
            {{- if and .Values.postgres.migrations (hasKey .Values.postgres.migrations "enabled") (not .Values.postgres.migrations.enabled) }}
            - name: POSTGRES_RUN_MIGRATIONS
              value: "false"
            {{- end }}
            {{- if and .Values.postgres.migrations .Values.postgres.migrations.authType }}
            - name: POSTGRES_MIGRATIONS_AUTH_TYPE
              value: {{ .Values.postgres.migrations.authType | quote }}
            {{- end }}
            {{- if and .Values.postgres.migrations .Values.postgres.migrations.dsn }}
            - name: POSTGRES_MIGRATIONS_DSN
              value: {{ .Values.postgres.migrations.dsn | quote }}
            {{- else if and .Values.postgres.migrations .Values.postgres.migrations.dsnSecret .Values.postgres.migrations.dsnSecret.name }}
            - name: POSTGRES_MIGRATIONS_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.migrations.dsnSecret.name }}
                  key: {{ .Values.postgres.migrations.dsnSecret.key }}
            {{- else if and .Values.postgres.migrationsDsnSecret .Values.postgres.migrationsDsnSecret.name }}
            - name: POSTGRES_MIGRATIONS_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.migrationsDsnSecret.name }}
                  key: {{ .Values.postgres.migrationsDsnSecret.key }}
            {{- end }}
            {{- if and .Values.postgres.migrations .Values.postgres.migrations.user }}
            - name: POSTGRES_MIGRATIONS_USER
              value: {{ .Values.postgres.migrations.user | quote }}
            {{- else if and .Values.postgres.migrations .Values.postgres.migrations.userSecret .Values.postgres.migrations.userSecret.name }}
            - name: POSTGRES_MIGRATIONS_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.migrations.userSecret.name }}
                  key: {{ .Values.postgres.migrations.userSecret.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
              {{- with .Values.persistence.subPath }}
              subPath: {{ . | quote }}
              {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: data
          {{- if and .Values.persistence.enabled .Values.persistence.csi.inline }}
          csi:
            driver: {{ required "A valid persistence.csi.driver is required when persistence.csi.inline is true" .Values.persistence.csi.driver | quote }}
            readOnly: {{ .Values.persistence.csi.readOnly | default false }}
            {{- with .Values.persistence.csi.fsType }}
            fsType: {{ . | quote }}
            {{- end }}
            {{- with .Values.persistence.csi.volumeAttributes }}
            volumeAttributes:
              {{- toYaml . | nindent 14 }}
            {{- end }}
            {{- with .Values.persistence.csi.nodePublishSecretRef }}
            nodePublishSecretRef:
              {{- toYaml . | nindent 14 }}
            {{- end }}
          {{- else if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (include "spool-rack.fullname" .) .Values.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
