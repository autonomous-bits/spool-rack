replicaCount: 1

image:
  repository: ghcr.io/autonomous-bits/spool-rack
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automount: false

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

service:
  type: ClusterIP
  port: 8080

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

postgres:
  # Authentication method: "password" or "azure" (for Azure Managed Identity / Workload Identity)
  authType: "password"

  # PostgreSQL connection string / DSN (can be used directly when using Azure auth without passwords)
  dsn: ""

  # Secret containing the connection string / DSN
  dsnSecret:
    name: ""
    key: POSTGRES_DSN

  # PostgreSQL user / role (e.g. managed identity name "id-ixs-rng-dev-em20-spl-02")
  user: ""

  # Secret containing the PostgreSQL username
  userSecret:
    name: ""
    key: POSTGRES_USER

  # Azure-specific settings (used when authType is "azure")
  azure:
    # Client ID of user-assigned managed identity (optional if set via AZURE_CLIENT_ID or Workload Identity)
    clientId: ""
    # OAuth2 resource scope (defaults to https://ossrdbms-aad.database.windows.net/.default)
    scope: ""

  # Maximum connection lifetime for pooled connections (e.g. "45m", defaults to 45m for Azure auth)
  maxConnLifetime: ""

  # Database schema migrations configuration
  migrations:
    # Whether to run migrations at startup
    enabled: true
    # Authentication method for migrations: "password" or "azure" (defaults to postgres.authType)
    authType: ""
    # DSN for migrations (defaults to postgres.dsn)
    dsn: ""
    # Secret containing DSN for migrations
    dsnSecret:
      name: ""
      key: POSTGRES_MIGRATIONS_DSN
    # User for migrations (defaults to postgres.user)
    user: ""
    # Secret containing username for migrations
    userSecret:
      name: ""
      key: POSTGRES_MIGRATIONS_USER

  # Backwards compatibility: secret for migrations DSN
  migrationsDsnSecret:
    name: ""
    key: POSTGRES_MIGRATIONS_DSN

persistence:
  # Enable persistence for CAS (content-addressed storage) data.
  # If false, an emptyDir volume is used.
  enabled: true

  # Existing PersistentVolumeClaim to use instead of creating one
  existingClaim: ""

  # Container mount path for CAS data (also sets CAS_ROOT env var)
  mountPath: /var/lib/spool-rack

  # Optional subPath within the volume to mount
  subPath: ""

  # Storage class name (leave empty for cluster default, or set to a CSI-backed storage class)
  storageClass: ""

  # Access modes for the PVC (e.g. ReadWriteOnce for block, ReadWriteMany for shared filesystems)
  accessModes:
    - ReadWriteOnce

  # Requested storage size
  size: 10Gi

  # Volume mode (Filesystem or Block)
  volumeMode: Filesystem

  # PersistentVolume reclaim policy when static PV is provisioned (Retain or Delete)
  reclaimPolicy: Retain

  # Additional annotations for the PersistentVolumeClaim
  annotations: {}

  # Additional labels for the PersistentVolumeClaim
  labels: {}

  # CSI (Container Storage Interface) driver configuration
  csi:
    # Set to true to create a static PersistentVolume with CSI driver spec bound to the PVC
    enabled: false

    # Set to true to mount the CSI volume directly inline in the Pod spec without a PVC
    inline: false

    # CSI driver name (e.g. "efs.csi.aws.com", "smb.csi.k8s.io", "file.csi.azure.com", "ebs.csi.aws.com")
    driver: ""

    # Unique volume identifier required by the CSI driver (e.g. AWS EFS filesystem ID "fs-12345678", SMB share path)
    volumeHandle: ""

    # Whether the volume is read-only
    readOnly: false

    # Filesystem type (e.g. "ext4", "xfs")
    fsType: ""

    # Driver-specific attributes (passed to CSI driver)
    volumeAttributes: {}

    # Optional reference to a Secret containing credentials for node publish operations (e.g. SMB credentials)
    nodePublishSecretRef: {}

    # Optional reference to a Secret for node staging
    nodeStageSecretRef: {}

    # Optional reference to a Secret for controller volume expansion
    controllerExpandSecretRef: {}

# Additional environment variables to pass to the container
extraEnv: []

# Additional volumes to mount on the pod
extraVolumes: []

# Additional volume mounts for the spool-rack container
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
