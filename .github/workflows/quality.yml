name: Quality

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".vscode/**"
      - ".gitattributes"
      - ".gitignore"
      - "LICENCE"
      - "security.txt"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".agents/**"
      - ".vscode/**"
      - ".gitattributes"
      - ".gitignore"
      - "LICENCE"
      - "security.txt"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: |
            go.sum
            cmd/spool-rack/go.sum
      - name: Install analysis tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run root-module quality checks
        run: |
          make fmt-check
          make tidy-check
          golangci-lint run ./...
          staticcheck ./...
          govulncheck ./...
      - name: Run server-module quality checks
        working-directory: cmd/spool-rack
        run: |
          go mod tidy -diff
          go vet ./...
          staticcheck ./...
          govulncheck ./...
