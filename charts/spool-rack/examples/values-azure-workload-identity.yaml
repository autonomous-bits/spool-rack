# Example configuration for deploying Spool Rack on Azure Kubernetes Service (AKS)
# using Azure Workload Identity to connect to Azure Database for PostgreSQL Flexible Server.
#
# Prerequisites:
# 1. An Azure User-Assigned Managed Identity (e.g. id-ixs-rng-dev-em20-spl-02)
# 2. AKS cluster with Workload Identity enabled:
#      az aks update --resource-group <rg> --name <cluster> --enable-oidc-issuer --enable-workload-identity
# 3. Federated identity credential created linking the Kubernetes ServiceAccount to the Azure identity:
#      az identity federated-credential create \
#        --name spool-rack-fedcred \
#        --identity-name id-ixs-rng-dev-em20-spl-02 \
#        --resource-group <rg> \
#        --issuer "<aks-oidc-issuer-url>" \
#        --subject "system:serviceaccount:<namespace>:spool-rack"
# 4. PostgreSQL Entra ID principal created in the database for the managed identity:
#      select * from pgaadauth_create_principal('id-ixs-rng-dev-em20-spl-02', false, false);
#      grant connect on database spool_rack to "id-ixs-rng-dev-em20-spl-02";
#      grant all on schema public to "id-ixs-rng-dev-em20-spl-02";

serviceAccount:
  create: true
  name: "spool-rack"
  # automount must be true for the Workload Identity mutating webhook to project the token
  automount: true
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000" # Replace with Managed Identity Client ID

podLabels:
  azure.workload.identity/use: "true"

postgres:
  # Use Azure Managed Identity / Entra token authentication
  authType: "azure"

  # PostgreSQL connection string without static password
  dsn: "host=psql-spool-dev.postgres.database.azure.com port=5432 dbname=spool_rack sslmode=require"

  # Database user matching the Entra principal name in PostgreSQL
  user: "id-ixs-rng-dev-em20-spl-02"

  azure:
    # Optional: override client ID explicitly if not using the ServiceAccount annotation
    clientId: ""
    # Optional: custom scope for sovereign clouds (defaults to https://ossrdbms-aad.database.windows.net/.default)
    scope: ""

  # Recycle pooled connections before 60-90 min token expiry (defaults to 45m)
  maxConnLifetime: "45m"

  migrations:
    # Set to true if the managed identity has schema DDL permissions.
    # Set to false if migrations are run out-of-band or via a dedicated CI/CD job.
    enabled: true
